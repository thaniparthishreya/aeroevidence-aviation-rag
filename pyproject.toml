[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aviation-safety-rag"
version = "0.1.0"
description = "Citation-first research assistant for public aviation safety documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pypdf>=5,<6",
  "python-dotenv>=1,<2",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["aviation_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
